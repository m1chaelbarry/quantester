[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantester"
version = "0.1.0"
description = "Institutional-grade event-driven quantitative backtesting engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]
yfinance = ["yfinance>=0.2.40"]
ccxt = ["ccxt>=4"]
akshare = ["akshare>=1.14"]
data = [
    "yfinance>=0.2.40",
    "ccxt>=4",
    "akshare>=1.14",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["quantester*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
